name: Build LightCull (macOS & Windows)

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build LightCull.app
        run: pyinstaller --noconfirm --windowed --onedir --name "LightCull" --collect-all customtkinter main.py

      - name: Package into DMG installer
        run: |
          mkdir -p dmg_stage
          cp -R dist/LightCull.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          sleep 2
          hdiutil create -volname "LightCull" -srcfolder dmg_stage -ov -format UDZO LightCull-macOS.dmg

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: LightCull-macOS
          path: LightCull-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build LightCull.exe
        run: pyinstaller --noconfirm --windowed --onedir --name "LightCull" --collect-all customtkinter main.py

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } else {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: LightCull-Windows
          path: dist_installer/LightCull-Windows-Setup.exe

  create-release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/LightCull-macOS/LightCull-macOS.dmg
            artifacts/LightCull-Windows/LightCull-Windows-Setup.exe
